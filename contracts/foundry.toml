[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
via_ir = true
evm_version = "prague"

optimizer = true
optimizer_runs = 200
# READ-ONLY, deliberately narrow. The extra entries let `script/RegisterTokens.s.sol` read a
# `tokens.json` manifest where it actually ships (next to `channel_backing.json`, or the template
# under node/). NEVER widen this to `../` — the repo root contains gitignored secrets (.claude/).
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "../proof-da-output/" },
    { access = "read", path = "../tests/fixtures/" },
    { access = "read", path = "../node/" },
    { access = "read", path = "../wallet-live-work/" },
    { access = "read", path = "../deploy-staging/" },
]

remappings = [
    "@mle/=lib/polygon-plonky2/mle/contracts/src/",
    "forge-std/=lib/forge-std/src/",
]

# Named RPC endpoints for `forge script --rpc-url <name>` / `cast --rpc-url <name>`.
# `sepolia` reads SEPOLIA_RPC_URL from the environment (.env / shell); `anvil` is the
# local rehearsal node started with `anvil --hardfork prague`.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

# Optional contract verification on Etherscan (only used with `forge script --verify`).
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
