[package]
name = "ethereum-types-boundary-audit"
version = "0.0.0"
edition = "2024"

[dependencies]
num-bigint = "0.4.6"
serde = "1"
plonky2_bn254 = { git = "https://github.com/InternetMaximalism/plonky2_bn254", branch = "wasm-main", default-features = false }
serde_json = "1"
intmax3-zkp = { path = "/Users/andropov/repos/intmax3-zkp" }
plonky2 = { path = "/Users/andropov/repos/intmax3-zkp/contracts/lib/polygon-plonky2/plonky2", default-features = false, features = ["std", "parallel"] }

[patch."https://github.com/InternetMaximalism/polygon-plonky2.git"]
plonky2 = { path = "/Users/andropov/repos/intmax3-zkp/contracts/lib/polygon-plonky2/plonky2" }
plonky2_field = { path = "/Users/andropov/repos/intmax3-zkp/contracts/lib/polygon-plonky2/field" }
plonky2_util = { path = "/Users/andropov/repos/intmax3-zkp/contracts/lib/polygon-plonky2/util" }
plonky2_maybe_rayon = { path = "/Users/andropov/repos/intmax3-zkp/contracts/lib/polygon-plonky2/maybe_rayon" }
plonky2_mle = { path = "/Users/andropov/repos/intmax3-zkp/contracts/lib/polygon-plonky2/mle" }
starky = { path = "/Users/andropov/repos/intmax3-zkp/contracts/lib/polygon-plonky2/starky" }

[patch.crates-io]
p3-merkle-tree = { path = "/Users/andropov/repos/intmax3-zkp/vendor/plonky3/p3-merkle-tree" }
p3-fri = { path = "/Users/andropov/repos/intmax3-zkp/vendor/plonky3/p3-fri" }
p3-uni-stark = { path = "/Users/andropov/repos/intmax3-zkp/vendor/plonky3/p3-uni-stark" }
# Second-version patches for the Plonky3 0.5.3 graph (regev_plonky3). These are
# MSRV-downgrade fixes for the pinned nightly-2025-03-23 toolchain, reused from
# the (now retired) external lattice-proof-helper setup.
p3-field-0503 = { path = "/Users/andropov/repos/intmax3-zkp/vendor/p3-field-0.5.3", package = "p3-field" }
# Reconstruct initialized DFT matrix views without generic aggregate layout casts.
p3-dft-0503 = { path = "/Users/andropov/repos/intmax3-zkp/vendor/p3-dft-0.5.3", package = "p3-dft" }
p3-fri-0503 = { path = "/Users/andropov/repos/intmax3-zkp/vendor/p3-fri-0.5.3", package = "p3-fri" }
p3-merkle-tree-0503 = { path = "/Users/andropov/repos/intmax3-zkp/vendor/p3-merkle-tree-0.5.3", package = "p3-merkle-tree" }
p3-uni-stark-0503 = { path = "/Users/andropov/repos/intmax3-zkp/vendor/p3-uni-stark-0.5.3", package = "p3-uni-stark" }
# Vendored p3-poseidon2-air 0.5.3 with a VISIBILITY-ONLY change (`pub(crate) fn eval`
# -> `pub fn eval`, see vendor/p3-poseidon2-air-0.5.3/src/air.rs). This exposes the
# upstream whole-permutation constraint evaluator so the P3-3 hash-sig wrapper AIR
# (a wider `[Poseidon2Cols | binding_cols]` row) can invoke it on the Poseidon2Cols
# prefix and add cross-row binding constraints. NO constraint logic is changed; the
# audited round-constraint body is byte-for-byte upstream.
p3-poseidon2-air-0503 = { path = "/Users/andropov/repos/intmax3-zkp/vendor/p3-poseidon2-air-0.5.3", package = "p3-poseidon2-air" }

[patch."https://github.com/leohio/regv-plonky3.git"]
regev_plonky3 = { path = "/Users/andropov/repos/intmax3-zkp/vendor/regev-plonky3-5495eda" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
